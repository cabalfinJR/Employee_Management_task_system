<!DOCTYPE html>
<html>
<head>
  <title>Login - Employee Task Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">
  <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-header bg-dark text-white text-center">
          <h4>Employee Task Management System</h4>
        </div>

        <div class="card-body">
          <h5 class="text-center mb-4">Login</h5>

          <div class="mb-3">
            <label>Email</label>
            <input type="email" id="email" class="form-control" placeholder="Enter email">
          </div>

          <div class="mb-3">
            <label>Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter password">
          </div>

          <button onclick="login()" class="btn btn-primary w-100">Login</button>

          <p id="message" class="text-danger text-center mt-3"></p>
        </div>

        <div class="card-footer text-center">
          <a href="index.html">Back to Home</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { app } from "./firebase-config.js";

  import {
    getAuth,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const auth = getAuth(app);
  const db = getFirestore(app);

  window.login = async function () {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const message = document.getElementById("message");

    if (!email || !password) {
      message.innerText = "Please enter email and password.";
      return;
    }

    try {
      await signInWithEmailAndPassword(auth, email, password);

      const q = query(
        collection(db, "users"),
        where("email", "==", email)
      );

      const querySnapshot = await getDocs(q);

      if (querySnapshot.empty) {
        message.innerText = "User role not found.";
        return;
      }

      let role = "";

      querySnapshot.forEach((doc) => {
        role = doc.data().role;
      });

      if (role === "admin") {
        window.location.href = "admin-dashboard.html";
      } else if (role === "employee") {
        window.location.href = "employee-dashboard.html";
      } else {
        message.innerText = "Invalid user role.";
      }

    } catch (error) {
      message.innerText = error.message;
    }
  };
</script>

</body>
</html>
