<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Employee Task Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:        #4F46E5;
      --brand-soft:   #EEF2FF;
      --brand-mid:    #818CF8;
      --success:      #059669;
      --success-soft: #D1FAE5;
      --danger:       #DC2626;
      --danger-soft:  #FEE2E2;
      --text-1:       #111827;
      --text-2:       #6B7280;
      --text-3:       #9CA3AF;
      --bg:           #F9FAFB;
      --surface:      #FFFFFF;
      --border:       #E5E7EB;
      --radius:       14px;
      --radius-sm:    8px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(79,70,229,0.08) 0%, transparent 70%);
      top: -120px; left: -120px;
      border-radius: 50%;
      animation: drift 10s ease-in-out infinite alternate;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(129,140,248,0.07) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      border-radius: 50%;
      animation: drift 13s ease-in-out infinite alternate-reverse;
      pointer-events: none;
    }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(79,70,229,0.08), 0 2px 8px rgba(0,0,0,0.04);
      overflow: hidden;
      position: relative;
      z-index: 1;
      animation: cardUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes cardUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-hero {
      background: var(--brand);
      padding: 2rem 2rem 1.75rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .card-hero::before {
      content: '';
      position: absolute;
      width: 180px; height: 180px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
      top: -60px; right: -40px;
    }
    .card-hero::after {
      content: '';
      position: absolute;
      width: 120px; height: 120px;
      background: rgba(255,255,255,0.04);
      border-radius: 50%;
      bottom: -40px; left: -20px;
    }
    .hero-icon {
      width: 56px; height: 56px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
      font-size: 24px; color: white;
      position: relative; z-index: 1;
    }
    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px; font-weight: 700;
      color: white; margin-bottom: 4px;
      position: relative; z-index: 1;
    }
    .hero-sub {
      font-size: 13px; color: rgba(255,255,255,0.75);
      position: relative; z-index: 1;
    }

    .card-body { padding: 1.75rem 2rem; }

    .form-group { margin-bottom: 16px; }
    .form-label {
      font-size: 12px; font-weight: 600;
      color: var(--text-2); margin-bottom: 6px; display: block;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      font-size: 17px; color: var(--text-3); pointer-events: none;
      transition: color 0.2s;
    }
    .form-input {
      width: 100%; padding: 10px 12px 10px 38px;
      font-size: 14px; font-family: 'Inter', sans-serif;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text-1);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
      background: var(--surface);
    }
    .form-input:focus + .input-icon,
    .input-wrap:focus-within .input-icon { color: var(--brand); }

    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-size: 16px; color: var(--text-3); cursor: pointer; transition: color 0.15s;
      background: none; border: none; padding: 0;
    }
    .toggle-pw:hover { color: var(--brand); }
    .pw-input { padding-right: 38px; }

    .btn-login {
      width: 100%; padding: 11px;
      font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif;
      background: var(--brand); color: white;
      border: none; border-radius: var(--radius-sm);
      cursor: pointer; transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 6px;
    }
    .btn-login:hover  { background: #4338CA; box-shadow: 0 4px 14px rgba(79,70,229,0.35); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg-box {
      font-size: 13px; padding: 10px 12px;
      border-radius: var(--radius-sm); margin-top: 14px;
      display: none; align-items: center; gap: 8px;
    }
    .msg-box.error   { background: var(--danger-soft);  color: var(--danger);  display: flex; }
    .msg-box.success { background: var(--success-soft); color: var(--success); display: flex; }

    .card-footer {
      padding: 14px 2rem;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 13px; color: var(--text-2);
    }
    .card-footer a {
      color: var(--brand); text-decoration: none; font-weight: 500;
    }
    .card-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="login-card">

  <div class="card-hero">
    <div class="hero-icon"><i class="ti ti-shield-check"></i></div>
    <div class="hero-title">Employee Task Management</div>
    <div class="hero-sub">Sign in to access your dashboard</div>
  </div>

  <div class="card-body">

    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <div class="input-wrap">
        <input
          type="email" id="email" class="form-input"
          placeholder="you@company.com" autocomplete="email"
        >
        <i class="ti ti-mail input-icon"></i>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div class="input-wrap">
        <input
          type="password" id="password" class="form-input pw-input"
          placeholder="Enter your password" autocomplete="current-password"
        >
        <i class="ti ti-lock input-icon"></i>
        <button class="toggle-pw" type="button" id="togglePw" title="Show / hide password">
          <i class="ti ti-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="login()">
      <div class="spinner" id="spinner"></div>
      <i class="ti ti-login" id="loginIcon"></i>
      <span id="loginLabel">Sign in</span>
    </button>

    <div class="msg-box" id="msgBox">
      <i class="ti ti-alert-circle"></i>
      <span id="msgText"></span>
    </div>

  </div>

  <div class="card-footer">
    <a href="index.html"><i class="ti ti-arrow-left" style="font-size:12px;vertical-align:-1px;"></i> Back to Home</a>
  </div>

</div>

<script type="module">
  import { app } from "./firebase-config.js";
  import {
    getAuth, signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, query, where, getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const auth = getAuth(app);
  const db   = getFirestore(app);

  // ── password toggle ──
  document.getElementById('togglePw').addEventListener('click', () => {
    const pw  = document.getElementById('password');
    const eye = document.getElementById('eyeIcon');
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.className = show ? 'ti ti-eye-off' : 'ti ti-eye';
  });

  // ── enter key ──
  ['email','password'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') window.login();
    });
  });

  // ── login ──
  window.login = async function() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) {
      showMsg('Please enter your email and password.', 'error'); return;
    }

    setLoading(true);
    hideMsg();

    try {
      await signInWithEmailAndPassword(auth, email, password);

      const q    = query(collection(db, 'users'), where('email', '==', email));
      const snap = await getDocs(q);

      if (snap.empty) { showMsg('User role not found.', 'error'); setLoading(false); return; }

      let role = '';
      snap.forEach(d => { role = d.data().role; });

      showMsg('Signing you in…', 'success');

      setTimeout(() => {
        if      (role === 'admin')    window.location.href = 'admin-dashboard.html';
        else if (role === 'employee') window.location.href = 'employee-dashboard.html';
        else { showMsg('Invalid user role.', 'error'); setLoading(false); }
      }, 600);

    } catch (err) {
      // FIX: modern Firebase Auth returns a single generic
      // 'auth/invalid-credential' for both a wrong email and a wrong
      // password (to avoid leaking which one was incorrect), so the old
      // separate 'auth/user-not-found' / 'auth/wrong-password' entries
      // were dead code that could no longer be reached. Removed them —
      // this is the same user-facing behavior, just without the unused
      // branches.
      const friendly = {
        'auth/invalid-credential':    'Incorrect email or password.',
        'auth/too-many-requests':     'Too many attempts. Please wait and try again.',
        'auth/network-request-failed':'Network error. Check your connection.',
      };
      showMsg(friendly[err.code] || err.message, 'error');
      setLoading(false);
    }
  };

  function setLoading(on) {
    const btn     = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner');
    const icon    = document.getElementById('loginIcon');
    const label   = document.getElementById('loginLabel');
    btn.disabled        = on;
    spinner.style.display = on ? 'block' : 'none';
    icon.style.display    = on ? 'none'  : '';
    label.textContent     = on ? 'Signing in…' : 'Sign in';
  }

  function showMsg(text, type) {
    const box  = document.getElementById('msgBox');
    const span = document.getElementById('msgText');
    box.className = 'msg-box ' + type;
    span.textContent = text;
    box.querySelector('i').className = type === 'error' ? 'ti ti-alert-circle' : 'ti ti-check';
  }

  function hideMsg() {
    document.getElementById('msgBox').className = 'msg-box';
  }
</script>
</body>
</html>
