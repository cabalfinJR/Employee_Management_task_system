<!DOCTYPE html>
<html>
<head>
  <title>Employee Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand">Employee Management</span>
    <a href="admin-dashboard.html" class="btn btn-outline-light">Back to Dashboard</a>
  </div>
</nav>

<div class="container mt-4">
  <h2>Employee Management</h2>
  <p class="text-muted">Add and view employees.</p>

  <div class="card shadow-sm mt-4">
    <div class="card-header bg-primary text-white">Add Employee</div>
    <div class="card-body">
      <input type="text" id="name" class="form-control mb-2" placeholder="Employee Name">
      <input type="email" id="email" class="form-control mb-2" placeholder="Employee Email">
      <input type="password" id="password" class="form-control mb-2" placeholder="Temporary Password">

      <button onclick="addEmployee()" class="btn btn-success">Add Employee</button>
      <p id="message" class="mt-2"></p>
    </div>
  </div>

  <div class="card shadow-sm mt-4">
    <div class="card-header bg-dark text-white">Employee List</div>
    <div class="card-body">
      <div id="employeeList">Loading employees...</div>
    </div>
  </div>
</div>

<script type="module">
  import { app } from "./firebase-config.js";

  import {
    getAuth,
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    doc,
    setDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const auth = getAuth(app);
  const db = getFirestore(app);

  function loadEmployees() {
    const employeeList = document.getElementById("employeeList");

    onSnapshot(collection(db, "users"), (querySnapshot) => {
      let html = "";

      querySnapshot.forEach((userDoc) => {
        const user = userDoc.data();

        if (user.role === "employee") {
          html += `
            <div class="border rounded p-3 mb-3">
              <h5>${user.name}</h5>
              <p class="mb-1"><strong>Email:</strong> ${user.email}</p>
              <span class="badge bg-success">${user.role}</span>
            </div>
          `;
        }
      });

      employeeList.innerHTML = html || "No employees found.";
    });
  }

  window.addEmployee = async function () {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const message = document.getElementById("message");

    if (!name || !email || !password) {
      message.innerText = "Please fill in all fields.";
      message.className = "text-danger mt-2";
      return;
    }

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const uid = userCredential.user.uid;

      await setDoc(doc(db, "users", uid), {
        name: name,
        email: email,
        role: "employee"
      });

      message.innerText = "Employee added successfully!";
      message.className = "text-success mt-2";

      document.getElementById("name").value = "";
      document.getElementById("email").value = "";
      document.getElementById("password").value = "";

    } catch (error) {
      message.innerText = error.message;
      message.className = "text-danger mt-2";
    }
  };

  loadEmployees();
</script>

</body>
</html>
