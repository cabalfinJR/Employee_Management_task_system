<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --brand:#4F46E5;--brand-soft:#EEF2FF;--brand-mid:#818CF8;
      --success:#059669;--success-soft:#D1FAE5;
      --warn:#D97706;--warn-soft:#FEF3C7;
      --danger:#DC2626;--danger-soft:#FEE2E2;
      --text-1:#111827;--text-2:#6B7280;--text-3:#9CA3AF;
      --bg:#F9FAFB;--surface:#FFFFFF;--border:#E5E7EB;
      --radius:12px;--radius-sm:8px;
    }
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-1);min-height:100vh;}
    nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .nav-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:var(--brand);display:flex;align-items:center;gap:8px;}
    .nav-right{display:flex;align-items:center;gap:12px;}
    .nav-clock{font-size:13px;font-weight:500;color:var(--text-2);background:var(--bg);padding:4px 12px;border-radius:20px;border:1px solid var(--border);}
    .bell-btn{position:relative;width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all 0.15s;}
    .bell-btn:hover{color:var(--brand);border-color:var(--brand);background:var(--brand-soft);}
    .bell-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface);display:none;animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
    .btn-logout{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--text-2);background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 14px;cursor:pointer;transition:all 0.15s;}
    .btn-logout:hover{background:var(--bg);color:var(--danger);border-color:var(--danger);}
    .page{max-width:860px;margin:0 auto;padding:2rem 1.25rem 4rem;}
    .alert-stack{display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem;}
    .alert{border-radius:var(--radius);padding:14px 18px;display:flex;align-items:flex-start;gap:12px;animation:slideDown 0.4s ease both;}
    @keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
    .alert-danger{background:#FFF5F5;border:1px solid #FECACA;}
    .alert-warn{background:#FFFBEB;border:1px solid #FDE68A;}
    .alert-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .alert-danger .alert-icon{background:var(--danger-soft);color:var(--danger);}
    .alert-warn .alert-icon{background:var(--warn-soft);color:var(--warn);}
    .alert-body{flex:1;}
    .alert-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;margin-bottom:4px;}
    .alert-danger .alert-title{color:var(--danger);}
    .alert-warn .alert-title{color:var(--warn);}
    .alert-tasks{list-style:none;display:flex;flex-direction:column;gap:4px;margin-top:6px;}
    .alert-tasks li{font-size:13px;color:var(--text-1);display:flex;align-items:center;gap:6px;}
    .alert-dismiss{background:none;border:none;cursor:pointer;font-size:16px;color:var(--text-3);padding:0;flex-shrink:0;transition:color 0.15s;}
    .alert-dismiss:hover{color:var(--text-1);}
    .hero{background:var(--brand);border-radius:var(--radius);padding:1.5rem 1.75rem;color:white;display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.25rem;position:relative;overflow:hidden;}
    .hero::before{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;background:rgba(255,255,255,0.06);border-radius:50%;}
    .hero::after{content:'';position:absolute;right:40px;bottom:-50px;width:120px;height:120px;background:rgba(255,255,255,0.04);border-radius:50%;}
    .hero-left{z-index:1;}
    .hero-label{font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;opacity:0.75;margin-bottom:4px;}
    .hero-name{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-bottom:4px;}
    .hero-sub{font-size:13px;opacity:0.8;}
    .hero-avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.18);border:2px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;flex-shrink:0;z-index:1;}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem;}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;display:flex;align-items:center;gap:12px;transition:transform 0.15s;}
    .stat-card:hover{transform:translateY(-2px);}
    .stat-icon{width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
    .stat-icon.blue{background:var(--brand-soft);color:var(--brand);}
    .stat-icon.green{background:var(--success-soft);color:var(--success);}
    .stat-icon.amber{background:var(--warn-soft);color:var(--warn);}
    .stat-icon.red{background:var(--danger-soft);color:var(--danger);}
    .stat-label{font-size:12px;color:var(--text-2);margin-bottom:2px;}
    .stat-value{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--text-1);}
    .section-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--text-1);display:flex;align-items:center;gap:8px;margin-bottom:12px;}
    .section-title i{font-size:18px;color:var(--brand);}
    .filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
    .filter-btn{font-size:12px;font-weight:500;padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;transition:all 0.15s;}
    .filter-btn.active,.filter-btn:hover{background:var(--brand);color:white;border-color:var(--brand);}
    #taskList{display:flex;flex-direction:column;gap:12px;}
    .task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;transition:box-shadow 0.2s,transform 0.15s;animation:slideIn 0.3s ease both;}
    @keyframes slideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    .task-card:hover{box-shadow:0 4px 16px rgba(79,70,229,0.08);transform:translateY(-1px);}
    .task-card.completed{opacity:0.75;border-left:3px solid var(--success);}
    .task-card.pending{border-left:3px solid var(--brand);}
    .task-card.overdue{border-left:3px solid var(--danger);background:#FFFAFA;}
    .task-card.due-soon{border-left:3px solid var(--warn);background:#FFFDF0;}
    .task-top{display:flex;align-items:flex-start;gap:14px;}
    .task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;}
    .task-check.done{background:var(--success);border-color:var(--success);color:white;}
    .task-check i{font-size:12px;}
    .task-body{flex:1;min-width:0;}
    .task-title{font-size:14px;font-weight:600;color:var(--text-1);margin-bottom:3px;}
    .task-card.completed .task-title{text-decoration:line-through;color:var(--text-2);}
    .task-desc{font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:8px;}
    .task-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;}
    .badge-pending{background:var(--brand-soft);color:var(--brand);}
    .badge-completed{background:var(--success-soft);color:var(--success);}
    /* priority badges — hidden once output submitted */
    .pri{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;}
    .pri-low{background:#F0FDF4;color:#166534;}
    .pri-medium{background:#EFF6FF;color:#1D4ED8;}
    .pri-high{background:var(--warn-soft);color:var(--warn);}
    .pri-urgent{background:var(--danger-soft);color:var(--danger);}
    .due{font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;}
    .due-ok{background:#F0FDF4;color:#166534;}
    .due-soon{background:var(--warn-soft);color:var(--warn);}
    .due-overdue{background:var(--danger-soft);color:var(--danger);}
    /* submission timing badge */
    .sub-timing{font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;}
    .sub-early{background:#D1FAE5;color:#065F46;}
    .sub-late {background:#FEE2E2;color:#991B1B;}
    .sub-ontime{background:#EFF6FF;color:#1D4ED8;}
    .task-action{margin-left:auto;font-size:12px;font-weight:500;padding:5px 14px;border-radius:var(--radius-sm);border:none;cursor:pointer;transition:all 0.15s;}
    .btn-complete{background:var(--success-soft);color:var(--success);}
    .btn-complete:hover{background:var(--success);color:white;}
    .btn-pending{background:var(--bg);color:var(--text-2);border:1px solid var(--border);}
    .btn-pending:hover{background:var(--warn-soft);color:var(--warn);border-color:var(--warn);}
    /* OUTPUT LINKS */
    .task-outputs{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;}
    .outputs-label{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:0.04em;display:flex;align-items:center;gap:6px;margin-bottom:10px;}
    .outputs-label i{color:var(--brand);font-size:14px;}
    .output-hint{font-size:12px;color:var(--text-3);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
    .output-hint i{font-size:14px;color:var(--brand-mid);}
    .link-form{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
    .link-input-wrap{position:relative;}
    .link-input{width:100%;padding:8px 12px 8px 34px;font-size:13px;font-family:'Inter',sans-serif;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text-1);outline:none;transition:border-color 0.15s,box-shadow 0.15s;}
    .link-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,0.1);}
    .link-input-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text-3);pointer-events:none;}
    .link-label-input{width:100%;padding:8px 12px;font-size:13px;font-family:'Inter',sans-serif;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text-1);outline:none;transition:border-color 0.15s;}
    .link-label-input:focus{border-color:var(--brand);}
    .platform-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
    .chip{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:4px;}
    .chip:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);}
    .btn-add-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:8px 14px;background:var(--brand);color:white;border:none;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.15s;}
    .btn-add-link:hover{background:#4338CA;}
    .btn-add-link:disabled{opacity:0.6;cursor:not-allowed;}
    .links-list{display:flex;flex-direction:column;gap:6px;}
    .link-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);transition:all 0.15s;animation:fadeIn 0.3s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
    .link-item:hover{border-color:var(--brand-mid);background:var(--brand-soft);}
    .link-platform-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
    .link-info{flex:1;min-width:0;}
    .link-name{font-size:13px;font-weight:500;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .link-url{font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .link-meta{font-size:11px;color:var(--text-3);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .link-actions{display:flex;gap:6px;flex-shrink:0;}
    .link-btn{width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:all 0.15s;text-decoration:none;}
    .link-btn:hover{transform:scale(1.1);}
    .link-btn.open:hover{background:var(--success-soft);color:var(--success);border-color:var(--success);}
    .link-btn.remove:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);}
    .no-links{font-size:12px;color:var(--text-3);text-align:center;padding:8px 0;font-style:italic;}
    .empty{text-align:center;padding:3rem 1rem;color:var(--text-3);}
    .empty i{font-size:40px;margin-bottom:12px;display:block;}
    .empty p{font-size:14px;}
    .toast-wrap{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;}
    .toast{color:white;font-size:13px;font-weight:500;padding:10px 16px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;animation:toastIn 0.3s ease;}
    @keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    .skeleton{background:linear-gradient(90deg,var(--border) 25%,var(--bg) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:var(--radius-sm);}
    @keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}
    @media(max-width:600px){.stats{grid-template-columns:1fr 1fr;}.hero{flex-direction:column;align-items:flex-start;}}
  </style>
</head>
<body>

<nav>
  <div class="nav-brand"><i class="ti ti-layout-dashboard"></i> My Dashboard</div>
  <div class="nav-right">
    <span class="nav-clock" id="navClock">--:--:--</span>
    <button class="bell-btn" title="Notifications" onclick="scrollToAlerts()">
      <i class="ti ti-bell"></i>
      <span class="bell-dot" id="bellDot"></span>
    </button>
    <button class="btn-logout" onclick="logout()"><i class="ti ti-logout"></i> Sign out</button>
  </div>
</nav>

<div class="page">
  <div class="alert-stack" id="alertStack"></div>

  <div class="hero">
    <div class="hero-left">
      <div class="hero-label">Welcome back</div>
      <div class="hero-name" id="heroName">Loading...</div>
      <div class="hero-sub" id="heroSub">Here's what's on your plate today</div>
    </div>
    <div class="hero-avatar" id="heroAvatar">??</div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-icon blue"><i class="ti ti-clipboard-list"></i></div>
      <div><div class="stat-label">Total</div><div class="stat-value" id="statTotal">—</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green"><i class="ti ti-circle-check"></i></div>
      <div><div class="stat-label">Completed</div><div class="stat-value" id="statDone">—</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber"><i class="ti ti-clock"></i></div>
      <div><div class="stat-label">Pending</div><div class="stat-value" id="statPending">—</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon red"><i class="ti ti-alert-triangle"></i></div>
      <div><div class="stat-label">Overdue</div><div class="stat-value" id="statOverdue" style="color:var(--danger);">—</div></div>
    </div>
  </div>

  <div class="section-title"><i class="ti ti-list-check"></i> My tasks</div>
  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('Pending',this)">Pending</button>
    <button class="filter-btn" onclick="setFilter('Completed',this)">Completed</button>
    <button class="filter-btn" onclick="setFilter('overdue',this)">🔴 Overdue</button>
    <button class="filter-btn" onclick="setFilter('due-soon',this)">🟠 Due soon</button>
  </div>

  <div id="taskList">
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div class="skeleton" style="height:160px;"></div>
      <div class="skeleton" style="height:160px;"></div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
  import { app } from "./firebase-config.js";
  import { getAuth, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, query, where,
    onSnapshot, doc, updateDoc, getDocs,
    addDoc, deleteDoc, serverTimestamp, Timestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const auth = getAuth(app);
  const db   = getFirestore(app);

  const today    = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
  let currentUserEmail = '';

  // ── CLOCK ──
  function tick(){
    document.getElementById('navClock').textContent =
      new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  setInterval(tick,1000); tick();

  const h=new Date().getHours();
  const greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';

  // ── AUTH GUARD ──
  onAuthStateChanged(auth, async (user)=>{
    if(!user){window.location.href='login.html';return;}
    const q=query(collection(db,'users'),where('email','==',user.email));
    const snap=await getDocs(q);
    if(snap.empty){window.location.href='login.html';return;}
    let role=''; snap.forEach(d=>{role=d.data().role;});
    if(role!=='employee'){window.location.href='admin-dashboard.html';return;}
    currentUserEmail=user.email;
    const emailPart=user.email.split('@')[0];
    const name=emailPart.charAt(0).toUpperCase()+emailPart.slice(1);
    document.getElementById('heroName').textContent  =greet+', '+name+' 👋';
    document.getElementById('heroSub').textContent   =user.email;
    document.getElementById('heroAvatar').textContent=name.slice(0,2).toUpperCase();
    loadTasks(user.email);
  });

  // ── DATE HELPERS ──
  function isOverdue(t){
    if(!t.dueDate||t.status==='Completed') return false;
    const d=new Date(t.dueDate); d.setHours(0,0,0,0); return d<today;
  }
  function isDueTomorrow(t){
    if(!t.dueDate||t.status==='Completed') return false;
    const d=new Date(t.dueDate); d.setHours(0,0,0,0); return d.getTime()===tomorrow.getTime();
  }
  function isDueSoon(t){
    if(!t.dueDate||t.status==='Completed') return false;
    const d=new Date(t.dueDate); d.setHours(0,0,0,0);
    const diff=(d-today)/(1000*60*60*24); return diff>=0&&diff<=2;
  }
  function fmtDate(s){
    if(!s) return '';
    return new Date(s).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});
  }
  function dueBadge(t){
    if(!t.dueDate) return '';
    if(isOverdue(t))    return `<span class="due due-overdue"><i class="ti ti-alert-circle" style="font-size:11px;"></i> Overdue · ${fmtDate(t.dueDate)}</span>`;
    if(isDueTomorrow(t))return `<span class="due due-soon"><i class="ti ti-clock" style="font-size:11px;"></i> Due tomorrow!</span>`;
    if(isDueSoon(t))    return `<span class="due due-soon"><i class="ti ti-clock" style="font-size:11px;"></i> Due soon · ${fmtDate(t.dueDate)}</span>`;
    return `<span class="due due-ok"><i class="ti ti-calendar" style="font-size:11px;"></i> Due ${fmtDate(t.dueDate)}</span>`;
  }
  function priBadge(p, hasOutput){
    // ✅ Hide priority badge once output is submitted
    if(hasOutput) return '';
    const map  ={low:'pri-low',medium:'pri-medium',high:'pri-high',urgent:'pri-urgent'};
    const label={low:'Low',medium:'Medium',high:'High',urgent:'Urgent'};
    const icon ={low:'🟢',medium:'🔵',high:'🟠',urgent:'🔴'};
    return `<span class="pri ${map[p]||'pri-medium'}">${icon[p]||'🔵'} ${label[p]||'Medium'}</span>`;
  }

  // ── SUBMISSION TIMING ──
  // Calculates how early or late the output was submitted vs due date
  function calcTiming(dueDate, submittedAt) {
    if (!dueDate || !submittedAt) return null;

    // due date: end of that day (23:59:59)
    const due = new Date(dueDate);
    due.setHours(23, 59, 59, 999);

    const submitted = submittedAt.toDate ? submittedAt.toDate() : new Date(submittedAt);
    const diffMs = submitted - due; // positive = late, negative = early
    const absDiffMs = Math.abs(diffMs);

    const days    = Math.floor(absDiffMs / (1000*60*60*24));
    const hours   = Math.floor((absDiffMs % (1000*60*60*24)) / (1000*60*60));
    const minutes = Math.floor((absDiffMs % (1000*60*60)) / (1000*60));

    let timeStr = '';
    if (days > 0)    timeStr += `${days}d `;
    if (hours > 0)   timeStr += `${hours}h `;
    timeStr += `${minutes}m`;
    timeStr = timeStr.trim() || '< 1m';

    if (diffMs > 0) {
      return { type: 'late',   label: `Submitted ${timeStr} late`,  cls: 'sub-late',   icon: 'ti-clock-x' };
    } else if (diffMs < 0) {
      return { type: 'early',  label: `Submitted ${timeStr} early`, cls: 'sub-early',  icon: 'ti-clock-check' };
    } else {
      return { type: 'ontime', label: 'Submitted on time',          cls: 'sub-ontime', icon: 'ti-check' };
    }
  }

  function timingBadge(timing) {
    if (!timing) return '';
    return `<span class="sub-timing ${timing.cls}"><i class="ti ${timing.icon}" style="font-size:11px;"></i> ${timing.label}</span>`;
  }

  // ── PLATFORM DETECTION ──
  function detectPlatform(url){
    try{
      const h=new URL(url).hostname.toLowerCase();
      if(h.includes('drive.google'))  return {name:'Google Drive',icon:'ti ti-brand-google-drive',color:'#1FA463',bg:'#E6F4EA'};
      if(h.includes('docs.google'))   return {name:'Google Docs', icon:'ti ti-file-text',          color:'#1A73E8',bg:'#E8F0FE'};
      if(h.includes('onedrive')||h.includes('1drv')) return {name:'OneDrive',icon:'ti ti-brand-onedrive',color:'#0078D4',bg:'#E3F2FD'};
      if(h.includes('dropbox'))       return {name:'Dropbox',     icon:'ti ti-brand-dropbox',       color:'#0061FF',bg:'#E8F0FF'};
      if(h.includes('github'))        return {name:'GitHub',      icon:'ti ti-brand-github',        color:'#24292E',bg:'#F0F0F0'};
      if(h.includes('figma'))         return {name:'Figma',       icon:'ti ti-brand-figma',         color:'#F24E1E',bg:'#FEF0EC'};
      if(h.includes('notion'))        return {name:'Notion',      icon:'ti ti-notebook',            color:'#191919',bg:'#F5F5F5'};
    }catch(e){}
    return {name:'Link',icon:'ti ti-link',color:'var(--brand)',bg:'var(--brand-soft)'};
  }

  // ── ALERTS ──
  function buildAlerts(tasks){
    const stack=document.getElementById('alertStack');
    const dot=document.getElementById('bellDot');
    stack.innerHTML='';
    const overdue  =tasks.filter(t=>isOverdue(t));
    const dueTomrow=tasks.filter(t=>isDueTomorrow(t));
    let has=false;
    if(overdue.length){
      has=true;
      const el=document.createElement('div');
      el.className='alert alert-danger';
      el.innerHTML=`
        <div class="alert-icon"><i class="ti ti-alert-triangle"></i></div>
        <div class="alert-body">
          <div class="alert-title">⚠️ You have ${overdue.length} overdue task${overdue.length>1?'s':''}!</div>
          <ul class="alert-tasks">${overdue.map(t=>`<li><i class="ti ti-point-filled" style="color:var(--danger);"></i><strong>${t.title}</strong> — was due ${fmtDate(t.dueDate)}</li>`).join('')}</ul>
        </div>
        <button class="alert-dismiss" onclick="this.closest('.alert').remove()"><i class="ti ti-x"></i></button>`;
      stack.appendChild(el);
    }
    if(dueTomrow.length){
      has=true;
      const el=document.createElement('div');
      el.className='alert alert-warn';
      el.innerHTML=`
        <div class="alert-icon"><i class="ti ti-clock"></i></div>
        <div class="alert-body">
          <div class="alert-title">⏰ ${dueTomrow.length>1?'These tasks are':'This task is'} due tomorrow!</div>
          <ul class="alert-tasks">${dueTomrow.map(t=>`<li><i class="ti ti-point-filled" style="color:var(--warn);"></i><strong>${t.title}</strong></li>`).join('')}</ul>
        </div>
        <button class="alert-dismiss" onclick="this.closest('.alert').remove()"><i class="ti ti-x"></i></button>`;
      stack.appendChild(el);
    }
    dot.style.display=has?'block':'none';
  }

  window.scrollToAlerts=function(){
    const s=document.getElementById('alertStack');
    if(s.children.length>0) s.scrollIntoView({behavior:'smooth',block:'start'});
    else showToast('✓ No urgent alerts right now','success');
  };

  // ── FILTER ──
  let currentFilter='all', allTasks=[], linksMap={};
  window.setFilter=function(f,btn){
    currentFilter=f;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderTasks();
  };

  function loadTasks(email){
    // live tasks listener
    const q=query(collection(db,'tasks'),where('assignedTo','==',email));
    onSnapshot(q,(snap)=>{
      allTasks=snap.docs.map(d=>({id:d.id,...d.data()}));
      updateStats(); buildAlerts(allTasks); renderTasks();
    });
    // live links listener — to know which tasks have outputs
    const lq=query(collection(db,'task_links'),where('submittedBy','==',email));
    onSnapshot(lq,(snap)=>{
      linksMap={};
      snap.forEach(d=>{
        const lk={id:d.id,...d.data()};
        if(!linksMap[lk.taskId]) linksMap[lk.taskId]=[];
        linksMap[lk.taskId].push(lk);
      });
      renderTasks();
    });
  }

  function updateStats(){
    const total  =allTasks.length;
    const done   =allTasks.filter(t=>t.status==='Completed').length;
    const pending=allTasks.filter(t=>t.status==='Pending').length;
    const overdue=allTasks.filter(t=>isOverdue(t)).length;
    animNum('statTotal',total); animNum('statDone',done);
    animNum('statPending',pending); animNum('statOverdue',overdue);
  }

  function animNum(id,target){
    const el=document.getElementById(id);
    let cur=parseInt(el.textContent)||0;
    if(cur===target){el.textContent=target;return;}
    const step=target>cur?1:-1;
    const iv=setInterval(()=>{cur+=step;el.textContent=cur;if(cur===target)clearInterval(iv);},60);
  }

  function renderTasks(){
    const list=document.getElementById('taskList');
    let filtered=allTasks;
    if(currentFilter==='Pending')   filtered=allTasks.filter(t=>t.status==='Pending');
    else if(currentFilter==='Completed') filtered=allTasks.filter(t=>t.status==='Completed');
    else if(currentFilter==='overdue')   filtered=allTasks.filter(t=>isOverdue(t));
    else if(currentFilter==='due-soon')  filtered=allTasks.filter(t=>isDueSoon(t)&&!isOverdue(t));

    if(!filtered.length){
      list.innerHTML=`<div class="empty"><i class="ti ti-clipboard-x"></i><p>${currentFilter==='all'?'No tasks assigned to you yet.':'No '+currentFilter.replace('-',' ')+' tasks.'}</p></div>`;
      return;
    }

    const sorted=[...filtered].sort((a,b)=>{
      if(a.status==='Completed'&&b.status!=='Completed') return 1;
      if(b.status==='Completed'&&a.status!=='Completed') return -1;
      if(isOverdue(a)&&!isOverdue(b)) return -1;
      if(isOverdue(b)&&!isOverdue(a)) return 1;
      if(isDueTomorrow(a)&&!isDueTomorrow(b)) return -1;
      if(isDueTomorrow(b)&&!isDueTomorrow(a)) return 1;
      return 0;
    });

    list.innerHTML=sorted.map((task,i)=>{
      const done   =task.status==='Completed';
      const over   =isOverdue(task);
      const soon   =isDueSoon(task)&&!over;
      const cls    =done?'completed':over?'overdue':soon?'due-soon':'pending';
      const links  =linksMap[task.id]||[];
      const hasOutput=links.length>0;

      // timing: use the earliest submission timestamp
      let timingHtml='';
      if(hasOutput && task.dueDate){
        const earliest=links.reduce((a,b)=>{
          const at=a.submittedAt?.seconds||0;
          const bt=b.submittedAt?.seconds||0;
          return at<bt?a:b;
        });
        const timing=calcTiming(task.dueDate, earliest.submittedAt);
        timingHtml=timingBadge(timing);
      }

      return `
        <div class="task-card ${cls}" style="animation-delay:${i*0.05}s" id="card-${task.id}">
          <div class="task-top">
            <div class="task-check ${done?'done':''}" onclick="${done?'markPending':'markCompleted'}('${task.id}')">
              ${done?'<i class="ti ti-check"></i>':''}
            </div>
            <div class="task-body">
              <div class="task-title">${task.title||'Untitled task'}</div>
              <div class="task-desc">${task.description||''}</div>
              <div class="task-footer">
                <span class="badge ${done?'badge-completed':'badge-pending'}">${done?'Completed':'Pending'}</span>
                ${task.priority&&!hasOutput?priBadge(task.priority,false):''}
                ${dueBadge(task)}
                ${timingHtml}
                ${done
                  ?`<button class="task-action btn-pending" onclick="markPending('${task.id}')"><i class="ti ti-refresh" style="font-size:12px;vertical-align:-1px;"></i> Mark pending</button>`
                  :`<button class="task-action btn-complete" onclick="markCompleted('${task.id}')"><i class="ti ti-check" style="font-size:12px;vertical-align:-1px;"></i> Mark complete</button>`}
              </div>
            </div>
          </div>

          <!-- OUTPUT LINKS -->
          <div class="task-outputs">
            <div class="outputs-label"><i class="ti ti-link"></i> Output links ${hasOutput?`<span style="background:var(--success-soft);color:var(--success);font-size:10px;padding:1px 7px;border-radius:20px;font-weight:700;">${links.length} submitted</span>`:''}</div>
            ${!hasOutput?`<div class="output-hint"><i class="ti ti-info-circle"></i> Upload your output to Google Drive or similar, then paste the share link below.</div>`:''}
            <div class="platform-chips">
              <div class="chip" onclick="fillLink('${task.id}','https://drive.google.com/')"><i class="ti ti-brand-google-drive"></i> Google Drive</div>
              <div class="chip" onclick="fillLink('${task.id}','https://onedrive.live.com/')"><i class="ti ti-brand-onedrive"></i> OneDrive</div>
              <div class="chip" onclick="fillLink('${task.id}','https://www.dropbox.com/')"><i class="ti ti-brand-dropbox"></i> Dropbox</div>
              <div class="chip" onclick="fillLink('${task.id}','https://github.com/')"><i class="ti ti-brand-github"></i> GitHub</div>
            </div>
            <div class="link-form">
              <div class="link-input-wrap">
                <i class="ti ti-link link-input-icon"></i>
                <input type="url" class="link-input" id="url-${task.id}" placeholder="Paste share link here…">
              </div>
              <input type="text" class="link-label-input" id="label-${task.id}" placeholder="Label (optional) e.g. Final Report v2">
              <button class="btn-add-link" onclick="submitLink('${task.id}','${task.dueDate||''}')">
                <i class="ti ti-plus"></i> Add link
              </button>
            </div>
            <div class="links-list" id="links-${task.id}">
              ${renderLinks(links, task.dueDate)}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function renderLinks(links, dueDate){
    if(!links.length) return '<div class="no-links">No output links yet</div>';
    return links.map(lk=>{
      const pl=detectPlatform(lk.url);
      const ts=lk.submittedAt
        ?new Date(lk.submittedAt.seconds*1000).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})
        :'just now';
      const timing=dueDate&&lk.submittedAt?calcTiming(dueDate,lk.submittedAt):null;
      return `
        <div class="link-item">
          <div class="link-platform-icon" style="background:${pl.bg};color:${pl.color};"><i class="${pl.icon}"></i></div>
          <div class="link-info">
            <div class="link-name">${lk.label||pl.name}</div>
            <div class="link-url">${lk.url}</div>
            <div class="link-meta">
              ${pl.name} · ${ts}
              ${timing?`· ${timingBadge(timing)}`:''}
            </div>
          </div>
          <div class="link-actions">
            <a href="${lk.url}" target="_blank" rel="noopener" class="link-btn open" title="Open"><i class="ti ti-external-link"></i></a>
            <button class="link-btn remove" title="Remove" onclick="removeLink('${lk.id}')"><i class="ti ti-trash"></i></button>
          </div>
        </div>`;
    }).join('');
  }

  window.fillLink=function(taskId,url){
    const input=document.getElementById('url-'+taskId);
    if(input){input.value=url;input.focus();}
  };

  window.submitLink=async function(taskId, dueDate){
    const urlInput  =document.getElementById('url-'+taskId);
    const labelInput=document.getElementById('label-'+taskId);
    const url  =(urlInput?.value||'').trim();
    const label=(labelInput?.value||'').trim();
    if(!url){showToast('Please paste a link first','warn');return;}
    try{new URL(url);}catch(e){showToast('Please enter a valid URL (include https://)','warn');return;}

    const btn=urlInput.closest('.task-outputs').querySelector('.btn-add-link');
    if(btn){btn.disabled=true;btn.textContent='Adding…';}

    try{
      const now=Timestamp.now();
      // calculate timing at submission time
      let timingNote='';
      if(dueDate){
        const timing=calcTiming(dueDate,now);
        if(timing) timingNote=timing.label;
      }

      await addDoc(collection(db,'task_links'),{
        taskId,
        url,
        label:label||'',
        submittedBy:currentUserEmail,
        submittedAt:now,
        dueDate:dueDate||'',
        timingNote  // stored in Firestore for admin reports
      });
      if(urlInput)   urlInput.value='';
      if(labelInput) labelInput.value='';
      showToast('✓ Output link added!','success');
    }catch(err){
      showToast('Error: '+err.message,'danger');
    }finally{
      if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-plus"></i> Add link';}
    }
  };

  window.removeLink=async function(linkId){
    if(!confirm('Remove this output link?')) return;
    try{
      await deleteDoc(doc(db,'task_links',linkId));
      showToast('🗑 Link removed','danger');
    }catch(err){showToast('Error: '+err.message,'danger');}
  };

  window.markCompleted=async function(taskId){
    await updateDoc(doc(db,'tasks',taskId),{status:'Completed'});
    showToast('✓ Task marked as completed','success');
  };
  window.markPending=async function(taskId){
    await updateDoc(doc(db,'tasks',taskId),{status:'Pending'});
    showToast('↩ Task moved back to pending','warn');
  };
  window.logout=function(){signOut(auth).then(()=>window.location.href='login.html');};

  function showToast(msg,type){
    const wrap=document.getElementById('toastWrap');
    const toast=document.createElement('div');
    toast.className='toast';
    toast.style.background=type==='success'?'#059669':type==='danger'?'#DC2626':'#D97706';
    toast.textContent=msg;
    wrap.appendChild(toast);
    setTimeout(()=>toast.remove(),3500);
  }
</script>
</body>
</html>
