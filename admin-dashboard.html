<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand">Employee Task Management System</span>
    <button onclick="logout()" class="btn btn-outline-light">Logout</button>
  </div>
</nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center">
  <div>
    <h2>Admin Dashboard</h2>
    <p class="text-muted">Welcome, Administrator</p>
  </div>

  <a href="employee-management.html" class="btn btn-primary">
    Manage Employees
  </a>
</div>

  <div class="card shadow-sm mt-4">
    <div class="card-header bg-primary text-white" id="formTitle">Add New Task</div>
    <div class="card-body">
      <input type="hidden" id="editTaskId">

      <input type="text" id="title" class="form-control mb-2" placeholder="Task Title">
      <textarea id="description" class="form-control mb-2" placeholder="Task Description"></textarea>
      <input type="text" id="assignedTo" class="form-control mb-2" placeholder="Assigned To">

      <button onclick="addTask()" id="addBtn" class="btn btn-success">Add Task</button>
      <button onclick="saveEdit()" id="saveBtn" class="btn btn-warning d-none">Save Changes</button>
      <button onclick="cancelEdit()" id="cancelBtn" class="btn btn-secondary d-none">Cancel</button>

      <p id="message" class="mt-2"></p>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-md-4">
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <h5>Total Tasks</h5>
          <h2 id="totalTasks">0</h2>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <h5>Pending Tasks</h5>
          <h2 id="pendingTasks">0</h2>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <h5>Completed Tasks</h5>
          <h2 id="completedTasks">0</h2>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mt-4 mb-5">
    <div class="card-header bg-dark text-white">Task List</div>
    <div class="card-body">
      <div id="taskList">Loading tasks...</div>
    </div>
  </div>
</div>

<script type="module">
  import { app } from "./firebase-config.js";
  import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const auth = getAuth(app);
  const db = getFirestore(app);

  function loadTasks() {
    const taskList = document.getElementById("taskList");
    const totalTasks = document.getElementById("totalTasks");
    const pendingTasks = document.getElementById("pendingTasks");
    const completedTasks = document.getElementById("completedTasks");

    onSnapshot(collection(db, "tasks"), (querySnapshot) => {
      let total = 0;
      let pending = 0;
      let completed = 0;
      let html = "";

      querySnapshot.forEach((taskDoc) => {
        const task = taskDoc.data();
        const taskId = taskDoc.id;
        total++;

        if (task.status === "Pending") pending++;
        if (task.status === "Completed") completed++;

        const badgeClass = task.status === "Completed" ? "bg-success" : "bg-primary";

        html += `
          <div class="border rounded p-3 mb-3">
            <h5>${task.title}</h5>
            <p>${task.description}</p>
            <span class="badge ${badgeClass}">${task.status}</span>
            <p class="mt-2 mb-2"><strong>Assigned to:</strong> ${task.assignedTo}</p>

            <button class="btn btn-sm btn-warning me-2"
              onclick="editTask('${taskId}', '${task.title}', '${task.description}', '${task.assignedTo}')">
              Edit
            </button>

            ${
              task.status === "Pending"
                ? `<button class="btn btn-sm btn-success me-2" onclick="markCompleted('${taskId}')">Mark Completed</button>`
                : `<button class="btn btn-sm btn-secondary me-2" onclick="markPending('${taskId}')">Mark Pending</button>`
            }

            <button class="btn btn-sm btn-danger" onclick="deleteTask('${taskId}')">Delete</button>
          </div>
        `;
      });

      totalTasks.innerText = total;
      pendingTasks.innerText = pending;
      completedTasks.innerText = completed;

      taskList.innerHTML = total === 0 ? "No tasks found." : html;
    });
  }

  window.addTask = async function () {
    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("description").value.trim();
    const assignedTo = document.getElementById("assignedTo").value.trim();
    const message = document.getElementById("message");

    if (!title || !description || !assignedTo) {
      message.innerText = "Please fill in all fields.";
      message.className = "text-danger mt-2";
      return;
    }

    await addDoc(collection(db, "tasks"), {
      title,
      description,
      assignedTo,
      status: "Pending"
    });

    message.innerText = "Task added successfully!";
    message.className = "text-success mt-2";
    clearForm();
  };

  window.editTask = function (taskId, title, description, assignedTo) {
    document.getElementById("editTaskId").value = taskId;
    document.getElementById("title").value = title;
    document.getElementById("description").value = description;
    document.getElementById("assignedTo").value = assignedTo;

    document.getElementById("formTitle").innerText = "Edit Task";
    document.getElementById("addBtn").classList.add("d-none");
    document.getElementById("saveBtn").classList.remove("d-none");
    document.getElementById("cancelBtn").classList.remove("d-none");

    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  window.saveEdit = async function () {
    const taskId = document.getElementById("editTaskId").value;
    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("description").value.trim();
    const assignedTo = document.getElementById("assignedTo").value.trim();
    const message = document.getElementById("message");

    if (!title || !description || !assignedTo) {
      message.innerText = "Please fill in all fields.";
      message.className = "text-danger mt-2";
      return;
    }

    await updateDoc(doc(db, "tasks", taskId), {
      title,
      description,
      assignedTo
    });

    message.innerText = "Task updated successfully!";
    message.className = "text-success mt-2";
    clearForm();
  };

  window.cancelEdit = function () {
    clearForm();
  };

  function clearForm() {
    document.getElementById("editTaskId").value = "";
    document.getElementById("title").value = "";
    document.getElementById("description").value = "";
    document.getElementById("assignedTo").value = "";

    document.getElementById("formTitle").innerText = "Add New Task";
    document.getElementById("addBtn").classList.remove("d-none");
    document.getElementById("saveBtn").classList.add("d-none");
    document.getElementById("cancelBtn").classList.add("d-none");
  }

  window.markCompleted = async function (taskId) {
    await updateDoc(doc(db, "tasks", taskId), {
      status: "Completed"
    });
  };

  window.markPending = async function (taskId) {
    await updateDoc(doc(db, "tasks", taskId), {
      status: "Pending"
    });
  };

  window.deleteTask = async function (taskId) {
    if (confirm("Are you sure you want to delete this task?")) {
      await deleteDoc(doc(db, "tasks", taskId));
    }
  };

  window.logout = function () {
    signOut(auth).then(() => {
      window.location.href = "login.html";
    });
  };

  loadTasks();
</script>

</body>
</html>
