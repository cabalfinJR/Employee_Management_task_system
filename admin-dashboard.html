<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand">Employee Task Management System</span>
    <button onclick="logout()" class="btn btn-outline-light">Logout</button>
  </div>
</nav>

<div class="container mt-4">
  <h2>Admin Dashboard</h2>
  <p class="text-muted">Welcome, Administrator</p>

  <div class="card shadow-sm mt-4">
    <div class="card-header bg-primary text-white">Add New Task</div>
    <div class="card-body">
      <input type="text" id="title" class="form-control mb-2" placeholder="Task Title">
      <textarea id="description" class="form-control mb-2" placeholder="Task Description"></textarea>
      <input type="text" id="assignedTo" class="form-control mb-2" placeholder="Assigned To">
      <button onclick="addTask()" class="btn btn-success">Add Task</button>
      <p id="message" class="mt-2"></p>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-md-4">
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <h5>Total Tasks</h5>
          <h2 id="totalTasks">0</h2>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <h5>Pending Tasks</h5>
          <h2 id="pendingTasks">0</h2>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <h5>Completed Tasks</h5>
          <h2 id="completedTasks">0</h2>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mt-4">
    <div class="card-header bg-dark text-white">Task List</div>
    <div class="card-body">
      <div id="taskList">Loading tasks...</div>
    </div>
  </div>
</div>

<script type="module">
  import { app } from "./firebase-config.js";
  import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore,
    collection,
    getDocs,
    addDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const auth = getAuth(app);
  const db = getFirestore(app);

  async function loadTasks() {
    const taskList = document.getElementById("taskList");
    const totalTasks = document.getElementById("totalTasks");
    const pendingTasks = document.getElementById("pendingTasks");
    const completedTasks = document.getElementById("completedTasks");

    taskList.innerHTML = "Loading tasks...";

    let total = 0;
    let pending = 0;
    let completed = 0;
    let html = "";

    try {
      const querySnapshot = await getDocs(collection(db, "tasks"));

      querySnapshot.forEach((doc) => {
        const task = doc.data();
        total++;

        if (task.status === "Pending") pending++;
        if (task.status === "Completed") completed++;

        html += `
          <div class="border rounded p-3 mb-3">
            <h5>${task.title}</h5>
            <p>${task.description}</p>
            <span class="badge bg-primary">${task.status}</span>
            <p class="mt-2 mb-0"><strong>Assigned to:</strong> ${task.assignedTo}</p>
          </div>
        `;
      });

      totalTasks.innerText = total;
      pendingTasks.innerText = pending;
      completedTasks.innerText = completed;

      taskList.innerHTML = total === 0 ? "No tasks found." : html;

    } catch (error) {
      taskList.innerHTML = `<p class="text-danger">${error.message}</p>`;
    }
  }

  window.addTask = async function () {
    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("description").value.trim();
    const assignedTo = document.getElementById("assignedTo").value.trim();
    const message = document.getElementById("message");

    if (!title || !description || !assignedTo) {
      message.innerText = "Please fill in all fields.";
      message.className = "text-danger mt-2";
      return;
    }

    try {
      await addDoc(collection(db, "tasks"), {
        title: title,
        description: description,
        assignedTo: assignedTo,
        status: "Pending"
      });

      message.innerText = "Task added successfully!";
      message.className = "text-success mt-2";

      document.getElementById("title").value = "";
      document.getElementById("description").value = "";
      document.getElementById("assignedTo").value = "";

      await loadTasks();

    } catch (error) {
      message.innerText = error.message;
      message.className = "text-danger mt-2";
    }
  };

  window.logout = function () {
    signOut(auth).then(() => {
      window.location.href = "login.html";
    });
  };

  loadTasks();
</script>

</body>
</html>
